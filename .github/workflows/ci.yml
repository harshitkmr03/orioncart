name: CI
on: [push, pull_request]
jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Ensure JWT secret present
        run: |
          if [ -z "$JWT_SECRET" ]; then echo "JWT_SECRET missing" && exit 1; fi
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
      - name: Run backend tests
        run: |
          pushd backend
          ./mvnw -DskipTests=false test
          popd
  flyway-check:
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4
      - name: Shell check for flyway script
        run: |
          if [ ! -f scripts/check_flyway_migrations.sh ]; then echo "Flyway check script missing" && exit 1; fi
      - name: Run flyway migration check script
        run: |
          chmod +x scripts/check_flyway_migrations.sh
          ./scripts/check_flyway_migrations.shname: Frontend CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Test
      run: npm test -- --passWithNoTests
